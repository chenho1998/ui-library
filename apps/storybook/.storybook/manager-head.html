<!-- MUI-inspired sidebar & calm top config toolbar polish for the UI Library docs site -->
<style>
  /* Hide Storybook's default onboarding checklist box so the sidebar stays focused on components & docs */
  [data-testid='checklist-widget'],
  #storybook-checklist-widget,
  .sidebar-container > div:has([aria-label*='checklist' i]),
  .sidebar-container a[href*='storybook.js.org/docs/get-started'],
  #storybook-explorer-menu ~ div:has(button[aria-label*='checklist' i]),
  nav.sidebar-container div:has(> div > button[aria-label*='checklist' i]),
  nav.sidebar-container div:has(> button > svg + span):has(a[href*='storybook.js.org']),
  .sidebar-header + div:has([role='progressbar']) {
    display: none !important;
  }

  /* ===== Calm, uncluttered MUI/Vercel-style top config bar ===== */
  .sb-bar {
    height: 48px !important;
    padding: 0 14px !important;
    background: rgba(255, 255, 255, 0.92) !important;
    backdrop-filter: blur(8px);
    box-shadow: inset 0 -1px 0 #e6eaf2 !important;
  }

  /* Hide noisy developer-debug buttons that conflict with ThemeProvider or clutter the bar */
  .sb-bar button[aria-label='Reload story'],
  .sb-bar button[aria-label='Grid visibility'],
  .sb-bar button[aria-label='Preview background'],
  .sb-bar button[aria-label='Measure tool'],
  .sb-bar button[aria-label='Outline tool'],
  .sb-bar button[aria-label='Vision filter'],
  .sb-bar button[aria-label='Change zoom level'] {
    display: none !important;
  }

  /* Remove stray vertical divider hairlines left behind after hiding debug tools */
  .sb-bar > div > div > span:empty {
    display: none !important;
  }

  /* Restyle Scheme / Theme / Font selector buttons into calm, cohesive bordered pill dropdowns */
  .sb-bar button[aria-label^='Colour scheme'],
  .sb-bar button[aria-label^='Theme:'],
  .sb-bar button[aria-label^='Font:'] {
    display: inline-flex !important;
    align-items: center !important;
    gap: 6px !important;
    height: 30px !important;
    margin: 0 3px !important;
    padding: 0 10px 0 9px !important;
    border: 1px solid #d9dfe9 !important;
    border-radius: 8px !important;
    background: #f8fafc !important;
    color: #1f2937 !important;
    font-size: 12.5px !important;
    font-weight: 500 !important;
    line-height: 1 !important;
    box-shadow: 0 1px 1px rgba(15, 23, 42, 0.03) !important;
    transition: border-color 140ms ease, background-color 140ms ease, color 140ms ease, box-shadow 140ms ease !important;
  }

  .sb-bar button[aria-label^='Colour scheme'] svg,
  .sb-bar button[aria-label^='Theme:'] svg,
  .sb-bar button[aria-label^='Font:'] svg {
    width: 14px !important;
    height: 14px !important;
    color: #2c5df5 !important;
    flex-shrink: 0;
  }

  /* Subtle dropdown chevron indicator on our 3 config selectors */
  .sb-bar button[aria-label^='Colour scheme']::after,
  .sb-bar button[aria-label^='Theme:']::after,
  .sb-bar button[aria-label^='Font:']::after {
    content: '';
    display: inline-block;
    width: 5px;
    height: 5px;
    margin-left: 2px;
    margin-top: -2px;
    border-right: 1.5px solid #6b7280;
    border-bottom: 1.5px solid #6b7280;
    transform: rotate(45deg);
    opacity: 0.75;
    transition: border-color 140ms ease, opacity 140ms ease;
  }

  .sb-bar button[aria-label^='Colour scheme']:hover,
  .sb-bar button[aria-label^='Theme:']:hover,
  .sb-bar button[aria-label^='Font:']:hover {
    border-color: #93b4fb !important;
    background: #eff4ff !important;
    color: #1c47d1 !important;
    box-shadow: 0 1px 2px rgba(44, 93, 245, 0.1) !important;
  }

  .sb-bar button[aria-label^='Colour scheme']:hover::after,
  .sb-bar button[aria-label^='Theme:']:hover::after,
  .sb-bar button[aria-label^='Font:']:hover::after {
    border-color: #2c5df5;
    opacity: 1;
  }

  /* Uniform crisp square icon buttons for right-side utilities & sidebar Settings */
  .sb-bar button[aria-label='Viewport size'],
  .sb-bar button[aria-label='Open in isolation mode'],
  .sb-bar button[aria-label='Show addon panel'],
  .sb-bar button[aria-label='Enter full screen'],
  .sb-bar button[aria-label='Exit full screen'],
  .sidebar-header button[aria-label='Settings'] {
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    width: 30px !important;
    height: 30px !important;
    margin: 0 2px !important;
    padding: 0 !important;
    border: 1px solid transparent !important;
    border-radius: 8px !important;
    background: transparent !important;
    color: #5b6472 !important;
    transition: border-color 140ms ease, background-color 140ms ease, color 140ms ease !important;
  }

  .sb-bar button[aria-label='Viewport size']:hover,
  .sb-bar button[aria-label='Open in isolation mode']:hover,
  .sb-bar button[aria-label='Show addon panel']:hover,
  .sb-bar button[aria-label='Enter full screen']:hover,
  .sb-bar button[aria-label='Exit full screen']:hover,
  .sidebar-header button[aria-label='Settings']:hover {
    border-color: #d9dfe9 !important;
    background: #f3f6fb !important;
    color: #1f2937 !important;
  }

  /* ===== Clean MUI-style left sidebar ===== */
  #storybook-explorer-tree .sidebar-subheading {
    margin-top: 18px;
    margin-bottom: 4px;
    padding-top: 10px;
    border-top: 1px solid rgba(15, 23, 42, 0.06);
    color: #5b6270;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  #storybook-explorer-tree .sidebar-subheading:first-of-type {
    margin-top: 4px;
    padding-top: 2px;
    border-top: 0;
  }

  #storybook-explorer-tree .sidebar-item {
    position: relative;
    margin: 1px 8px;
    padding-top: 5px;
    padding-bottom: 5px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    color: #363c46;
    transition: background-color 120ms ease, color 120ms ease;
  }

  #storybook-explorer-tree .sidebar-item svg {
    color: #8b94a3 !important;
    opacity: 0.78;
    transition: color 120ms ease, opacity 120ms ease;
  }

  #storybook-explorer-tree .sidebar-item:hover {
    background: #edf1f7;
    color: #111827;
  }

  #storybook-explorer-tree .sidebar-item:hover svg {
    color: #4b5563 !important;
    opacity: 1;
  }

  #storybook-explorer-tree .sidebar-item[data-selected='true'] {
    background: #e8f0ff !important;
    color: #1c47d1 !important;
    font-weight: 600;
  }

  #storybook-explorer-tree .sidebar-item[data-selected='true']::before {
    content: '';
    position: absolute;
    left: 0;
    top: 5px;
    bottom: 5px;
    width: 3px;
    border-radius: 999px;
    background: #2c5df5;
  }

  #storybook-explorer-tree .sidebar-item[data-selected='true'] svg {
    color: #2c5df5 !important;
    opacity: 1;
  }

  #storybook-explorer-tree .sidebar-item[data-selected='true'] button {
    background: transparent !important;
    color: #1c47d1 !important;
  }

  .ui-sb-label {
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-width: 0;
    width: 100%;
  }

  .ui-sb-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .ui-sb-badge {
    padding: 0 6px;
    border-radius: 999px;
    background: #e5edff;
    color: #1d4ed8;
    border: 1px solid #c7d9ff;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 16px;
    flex-shrink: 0;
    white-space: nowrap;
  }

  @media (prefers-color-scheme: dark) {
    .sb-bar {
      background: rgba(24, 26, 31, 0.92) !important;
      box-shadow: inset 0 -1px 0 #2d3139 !important;
    }
    .sb-bar button[aria-label^='Colour scheme'],
    .sb-bar button[aria-label^='Theme:'],
    .sb-bar button[aria-label^='Font:'] {
      border-color: #383e4a !important;
      background: #22262e !important;
      color: #e5e7eb !important;
    }
    .sb-bar button[aria-label^='Colour scheme'] svg,
    .sb-bar button[aria-label^='Theme:'] svg,
    .sb-bar button[aria-label^='Font:'] svg {
      color: #769fff !important;
    }
    .sb-bar button[aria-label^='Colour scheme']::after,
    .sb-bar button[aria-label^='Theme:']::after,
    .sb-bar button[aria-label^='Font:']::after {
      border-color: #9ca3af;
    }
    .sb-bar button[aria-label^='Colour scheme']:hover,
    .sb-bar button[aria-label^='Theme:']:hover,
    .sb-bar button[aria-label^='Font:']:hover {
      border-color: #4f79e8 !important;
      background: #1a2a52 !important;
      color: #dbeafe !important;
    }
    .sb-bar button[aria-label='Viewport size'],
    .sb-bar button[aria-label='Open in isolation mode'],
    .sb-bar button[aria-label='Show addon panel'],
    .sb-bar button[aria-label='Enter full screen'],
    .sb-bar button[aria-label='Exit full screen'],
    .sidebar-header button[aria-label='Settings'] {
      color: #9ca3af !important;
    }
    .sb-bar button[aria-label='Viewport size']:hover,
    .sb-bar button[aria-label='Open in isolation mode']:hover,
    .sb-bar button[aria-label='Show addon panel']:hover,
    .sb-bar button[aria-label='Enter full screen']:hover,
    .sb-bar button[aria-label='Exit full screen']:hover,
    .sidebar-header button[aria-label='Settings']:hover {
      border-color: #383e4a !important;
      background: #262b35 !important;
      color: #f3f4f6 !important;
    }
    #storybook-explorer-tree .sidebar-subheading {
      color: #9ea5b2;
      border-top-color: rgba(255, 255, 255, 0.08);
    }
    #storybook-explorer-tree .sidebar-item { color: #d1d5db; }
    #storybook-explorer-tree .sidebar-item svg { color: #6b7280 !important; }
    #storybook-explorer-tree .sidebar-item:hover { background: #262930; color: #f9fafb; }
    #storybook-explorer-tree .sidebar-item[data-selected='true'] {
      background: #162a5c !important;
      color: #c8dbff !important;
    }
    #storybook-explorer-tree .sidebar-item[data-selected='true']::before { background: #769fff; }
    #storybook-explorer-tree .sidebar-item[data-selected='true'] :is(svg, button) { color: #9ec0ff !important; }
    .ui-sb-badge { background: #162a5c; color: #c8dbff; border-color: #26428a; }
  }
</style>
