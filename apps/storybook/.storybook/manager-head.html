<!-- MUI/Linear-inspired inline toolbar & synced Light/Dark Manager shell -->
<style>
  :root {
    --sb-bar-bg: rgba(255, 255, 255, 0.94);
    --sb-bar-border: #e5e9f2;
    --sb-seg-bg: #eef2f7;
    --sb-seg-border: #dde3ee;
    --sb-seg-active-bg: #ffffff;
    --sb-seg-active-fg: #111827;
    --sb-seg-fg: #525c6d;
    --sb-accent: #2c5df5;
    --sb-accent-soft: #eaf0ff;
    --sb-accent-fg: #1d4ed8;
    --sb-hover-bg: #f1f5fa;
  }

  html[data-ui-manager-scheme='dark'] {
    --sb-bar-bg: rgba(13, 16, 23, 0.94);
    --sb-bar-border: #1e2536;
    --sb-seg-bg: #141925;
    --sb-seg-border: #232b3e;
    --sb-seg-active-bg: #222b40;
    --sb-seg-active-fg: #f8fafc;
    --sb-seg-fg: #94a3b8;
    --sb-accent: #4c7dfe;
    --sb-accent-soft: #17254a;
    --sb-accent-fg: #a6c2fe;
    --sb-hover-bg: #181f2e;
  }

  /* Hide Storybook's default onboarding checklist box */
  [data-testid='checklist-widget'],
  #storybook-checklist-widget,
  .sidebar-container > div:has([aria-label*='checklist' i]),
  .sidebar-container a[href*='storybook.js.org/docs/get-started'],
  #storybook-explorer-menu ~ div:has(button[aria-label*='checklist' i]),
  nav.sidebar-container div:has(> div > button[aria-label*='checklist' i]),
  nav.sidebar-container div:has(> button > svg + span):has(a[href*='storybook.js.org']),
  .sidebar-header + div:has([role='progressbar']) {
    display: none !important;
  }

  /* ===== Clean 48px inline top bar ===== */
  .sb-bar {
    height: 48px !important;
    padding: 0 14px !important;
    background: var(--sb-bar-bg) !important;
    backdrop-filter: blur(10px);
    box-shadow: inset 0 -1px 0 var(--sb-bar-border) !important;
  }

  /* Hide noisy built-in developer debug icons */
  .sb-bar button[aria-label='Reload story'],
  .sb-bar button[aria-label='Grid visibility'],
  .sb-bar button[aria-label='Preview background'],
  .sb-bar button[aria-label='Measure tool'],
  .sb-bar button[aria-label='Outline tool'],
  .sb-bar button[aria-label='Vision filter'],
  .sb-bar button[aria-label='Change zoom level'] {
    display: none !important;
  }

  .sb-bar > div > div > span:empty {
    display: none !important;
  }

  /* ===== Custom inline controls (zero dropdowns) ===== */
  .ui-tb-root {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .ui-tb-sep {
    width: 1px;
    height: 18px;
    background: var(--sb-bar-border);
    flex-shrink: 0;
  }

  .ui-tb-segment {
    display: inline-flex;
    align-items: center;
    padding: 2px;
    border-radius: 9px;
    background: var(--sb-seg-bg);
    border: 1px solid var(--sb-seg-border);
    gap: 2px;
  }

  .ui-tb-seg-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 24px;
    padding: 0 9px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--sb-seg-fg);
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 140ms ease, color 140ms ease, box-shadow 140ms ease;
  }

  .ui-tb-seg-btn:hover:not(.is-active) {
    color: var(--sb-seg-active-fg);
  }

  .ui-tb-seg-btn.is-active {
    background: var(--sb-seg-active-bg);
    color: var(--sb-seg-active-fg);
    font-weight: 600;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
  }

  .ui-tb-seg-btn.is-active svg {
    color: var(--sb-accent);
  }

  .ui-tb-themes {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 2px;
    border-radius: 9px;
    background: var(--sb-seg-bg);
    border: 1px solid var(--sb-seg-border);
  }

  .ui-tb-theme-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 24px;
    padding: 0 8px;
    border: 1px solid transparent;
    border-radius: 7px;
    background: transparent;
    color: var(--sb-seg-fg);
    font: inherit;
    font-size: 11.5px;
    font-weight: 500;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 130ms ease, color 130ms ease, border-color 130ms ease, box-shadow 130ms ease;
  }

  .ui-tb-theme-btn:hover:not(.is-active) {
    color: var(--sb-seg-active-fg);
    background: var(--sb-hover-bg);
  }

  .ui-tb-theme-btn.is-active {
    background: var(--sb-seg-active-bg);
    color: var(--sb-seg-active-fg);
    border-color: var(--sb-seg-border);
    font-weight: 600;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
  }

  .ui-tb-dot {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    flex-shrink: 0;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15);
  }

  .ui-tb-font-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 28px;
    padding: 0 9px;
    border: 1px solid var(--sb-seg-border);
    border-radius: 8px;
    background: var(--sb-seg-bg);
    color: var(--sb-seg-fg);
    font: inherit;
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 130ms ease;
  }

  .ui-tb-font-btn:hover {
    color: var(--sb-seg-active-fg);
    border-color: var(--sb-accent);
  }

  .ui-tb-font-btn.is-active {
    background: var(--sb-accent-soft);
    border-color: var(--sb-accent);
    color: var(--sb-accent-fg);
    font-weight: 600;
  }

  .ui-tb-aa {
    font-weight: 700;
    font-size: 11px;
    opacity: 0.85;
  }

  /* Uniform crisp square icon buttons for right-side utilities & sidebar Settings */
  .sb-bar button[aria-label='Viewport size'],
  .sb-bar button[aria-label='Open in isolation mode'],
  .sb-bar button[aria-label='Show addon panel'],
  .sb-bar button[aria-label='Enter full screen'],
  .sb-bar button[aria-label='Exit full screen'],
  .sidebar-header button[aria-label='Settings'] {
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    width: 30px !important;
    height: 30px !important;
    margin: 0 2px !important;
    padding: 0 !important;
    border: 1px solid transparent !important;
    border-radius: 8px !important;
    background: transparent !important;
    color: var(--sb-seg-fg) !important;
    transition: border-color 140ms ease, background-color 140ms ease, color 140ms ease !important;
  }

  .sb-bar button[aria-label='Viewport size']:hover,
  .sb-bar button[aria-label='Open in isolation mode']:hover,
  .sb-bar button[aria-label='Show addon panel']:hover,
  .sb-bar button[aria-label='Enter full screen']:hover,
  .sb-bar button[aria-label='Exit full screen']:hover,
  .sidebar-header button[aria-label='Settings']:hover {
    border-color: var(--sb-seg-border) !important;
    background: var(--sb-hover-bg) !important;
    color: var(--sb-seg-active-fg) !important;
  }

  /* ===== Clean MUI-style left sidebar (synced to Light/Dark) ===== */
  #storybook-explorer-tree .sidebar-subheading {
    margin-top: 18px;
    margin-bottom: 4px;
    padding-top: 10px;
    border-top: 1px solid rgba(15, 23, 42, 0.06);
    color: #5b6472;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  #storybook-explorer-tree .sidebar-subheading:first-of-type {
    margin-top: 4px;
    padding-top: 2px;
    border-top: 0;
  }

  #storybook-explorer-tree .sidebar-item {
    position: relative;
    margin: 1px 8px;
    padding-top: 5px;
    padding-bottom: 5px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    color: #363c46;
    transition: background-color 120ms ease, color 120ms ease;
  }

  #storybook-explorer-tree .sidebar-item svg {
    color: #8b94a3 !important;
    opacity: 0.78;
    transition: color 120ms ease, opacity 120ms ease;
  }

  #storybook-explorer-tree .sidebar-item:hover {
    background: #edf1f7;
    color: #111827;
  }

  #storybook-explorer-tree .sidebar-item:hover svg {
    color: #4b5563 !important;
    opacity: 1;
  }

  #storybook-explorer-tree .sidebar-item[data-selected='true'] {
    background: #e8f0ff !important;
    color: #1c47d1 !important;
    font-weight: 600;
  }

  #storybook-explorer-tree .sidebar-item[data-selected='true']::before {
    content: '';
    position: absolute;
    left: 0;
    top: 5px;
    bottom: 5px;
    width: 3px;
    border-radius: 999px;
    background: #2c5df5;
  }

  #storybook-explorer-tree .sidebar-item[data-selected='true'] svg {
    color: #2c5df5 !important;
    opacity: 1;
  }

  #storybook-explorer-tree .sidebar-item[data-selected='true'] button {
    background: transparent !important;
    color: #1c47d1 !important;
  }

  .ui-sb-label {
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-width: 0;
    width: 100%;
  }

  .ui-sb-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .ui-sb-badge {
    padding: 0 6px;
    border-radius: 999px;
    background: #e5edff;
    color: #1d4ed8;
    border: 1px solid #c7d9ff;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 16px;
    flex-shrink: 0;
    white-space: nowrap;
  }

  /* Synced obsidian Dark Mode for left sidebar & shell */
  html[data-ui-manager-scheme='dark'] #storybook-explorer-tree .sidebar-subheading {
    color: #64748b;
    border-top-color: #1b2232;
  }
  html[data-ui-manager-scheme='dark'] #storybook-explorer-tree .sidebar-item {
    color: #cbd5e1;
  }
  html[data-ui-manager-scheme='dark'] #storybook-explorer-tree .sidebar-item svg {
    color: #64748b !important;
  }
  html[data-ui-manager-scheme='dark'] #storybook-explorer-tree .sidebar-item:hover {
    background: #151b28;
    color: #f8fafc;
  }
  html[data-ui-manager-scheme='dark'] #storybook-explorer-tree .sidebar-item:hover svg {
    color: #94a3b8 !important;
  }
  html[data-ui-manager-scheme='dark'] #storybook-explorer-tree .sidebar-item[data-selected='true'] {
    background: #162447 !important;
    color: #a6c2fe !important;
  }
  html[data-ui-manager-scheme='dark'] #storybook-explorer-tree .sidebar-item[data-selected='true']::before {
    background: #4c7dfe;
  }
  html[data-ui-manager-scheme='dark'] #storybook-explorer-tree .sidebar-item[data-selected='true'] :is(svg, button) {
    color: #769fff !important;
  }
  html[data-ui-manager-scheme='dark'] .ui-sb-badge {
    background: #162447;
    color: #a6c2fe;
    border-color: #273e78;
  }
</style>
