<!-- Refined MUI/Linear-style Docs & Component Detail styling (Crisp Light + Deep Obsidian Dark) -->
<style>
  :root {
    --docs-bg: #ffffff;
    --docs-surface: #ffffff;
    --docs-surface-subtle: #f6f8fb;
    --docs-border: #e2e6ee;
    --docs-border-soft: #e6eaf2;
    --docs-text: #17191d;
    --docs-text-muted: #545d6b;
    --docs-row-hover: #f9fbfe;
    --docs-accent: #2c5df5;
    --docs-accent-subtle: #eef3ff;
    --docs-accent-text: #1c47d1;
    --docs-success-bg: #ecfdf5;
    --docs-success-border: #86efac;
    --docs-success-fg: #15803d;
  }

  html[data-ui-docs-scheme='dark'] {
    --docs-bg: #090b10;
    --docs-surface: #10131c;
    --docs-surface-subtle: #161b26;
    --docs-border: #232a3b;
    --docs-border-soft: #1c2231;
    --docs-text: #f1f5f9;
    --docs-text-muted: #9fb0c7;
    --docs-row-hover: #151b28;
    --docs-accent: #4c7dfe;
    --docs-accent-subtle: #142655;
    --docs-accent-text: #a6c2fe;
    --docs-success-bg: #0c2319;
    --docs-success-border: #1e6b45;
    --docs-success-fg: #6ee7b7;
  }

  .sbdocs.sbdocs-wrapper {
    background: var(--docs-bg) !important;
    color: var(--docs-text);
    padding: 36px 28px 72px;
    transition: background-color 150ms ease, color 150ms ease;
  }
  .sbdocs.sbdocs-content {
    max-width: 980px;
  }
  /* Prevent Storybook Docs global typography margins from overriding @layer ui components */
  .sbdocs .ui-theme p,
  .sbdocs .ui-theme h1,
  .sbdocs .ui-theme h2,
  .sbdocs .ui-theme h3,
  .sbdocs .ui-theme h4,
  .sbdocs .ui-theme pre {
    margin: 0;
  }
  .sbdocs .ui-theme a {
    font-family: inherit;
    font-size: inherit;
  }
  .sbdocs h1,
  .sbdocs h2,
  .sbdocs h3 {
    letter-spacing: -0.02em;
    color: var(--docs-text);
  }
  .sbdocs p,
  .sbdocs li {
    color: var(--docs-text);
  }
  .ui-doc-section-heading {
    margin: 28px 0 12px !important;
    font-size: 20px !important;
    font-weight: 700 !important;
    letter-spacing: -0.02em !important;
    color: var(--docs-text) !important;
    border-bottom: 0 !important;
    padding-bottom: 0 !important;
  }
  .ui-doc-meta-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--docs-border);
    background: var(--docs-surface);
    color: var(--docs-text-muted) !important;
    font-size: 12px !important;
    font-weight: 500;
    line-height: 1.4;
    text-decoration: none !important;
    cursor: pointer;
    transition: border-color 120ms ease, background-color 120ms ease, color 120ms ease;
  }
  .ui-doc-meta-link:hover {
    border-color: var(--docs-accent);
    background: var(--docs-accent-subtle);
    color: var(--docs-accent-text) !important;
  }
  .ui-doc-meta-link--version {
    border-color: color-mix(in srgb, var(--docs-accent) 42%, transparent);
    background: var(--docs-accent-subtle);
    color: var(--docs-accent-text) !important;
    font-weight: 600;
  }
  .ui-doc-meta-sub {
    opacity: 0.8;
    font-weight: 500;
    font-size: 11px;
  }
  /* Upgraded Show Code / Copy Code buttons inside DemoFrame */
  .ui-demo-code-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 28px;
    padding: 0 11px;
    border-radius: 8px;
    border: 1px solid var(--ui-color-border, var(--docs-border));
    background: var(--ui-color-surface, var(--docs-surface));
    color: var(--ui-color-text-secondary, var(--docs-text-muted));
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    line-height: 1;
    cursor: pointer;
    transition: border-color 130ms ease, background-color 130ms ease, color 130ms ease, box-shadow 130ms ease;
  }
  .ui-demo-code-btn:hover {
    border-color: var(--ui-color-accent, var(--docs-accent));
    color: var(--ui-color-accent-text, var(--docs-accent-text));
    background: var(--ui-color-accent-subtle, var(--docs-accent-subtle));
  }
  .ui-demo-code-btn.is-active {
    border-color: var(--ui-color-accent, var(--docs-accent));
    background: var(--ui-color-accent-subtle, var(--docs-accent-subtle));
    color: var(--ui-color-accent-text, var(--docs-accent-text));
    font-weight: 600;
  }
  .ui-demo-code-btn.is-copied {
    border-color: var(--docs-success-border);
    background: var(--docs-success-bg);
    color: var(--docs-success-fg);
    font-weight: 600;
  }
  /* Previous / Next pagination cards */
  .ui-doc-pager-card {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--docs-border);
    background: var(--docs-surface);
    text-decoration: none !important;
    transition: border-color 140ms ease, background-color 140ms ease, transform 140ms ease;
  }
  .ui-doc-pager-card--next {
    align-items: flex-end;
    text-align: right;
  }
  .ui-doc-pager-card:hover {
    border-color: var(--docs-accent);
    background: var(--docs-surface-subtle);
    transform: translateY(-1px);
  }
  .ui-doc-pager-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--docs-text-muted);
  }
  .ui-doc-pager-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--docs-accent-text);
  }
  /* Clean MUI-style Docs preview frame */
  .sbdocs .sbdocs-preview {
    padding-top: 0 !important;
    border-radius: 14px;
    border: 1px solid var(--docs-border) !important;
    background: var(--docs-surface) !important;
    box-shadow: 0 1px 3px rgb(0 0 0 / 6%);
    margin: 14px 0 28px;
    overflow: hidden;
  }
  /* Hide Storybook's inner Reload / Zoom bar inside Docs canvases */
  .sbdocs .sbdocs-preview > div:first-child:has(button[aria-label='Zoom in']),
  .sbdocs .sbdocs-preview > div:first-child:has(button[aria-label='Reload story']) {
    display: none !important;
  }
  /* Avoid double-card framing when DemoFrame renders inside Storybook's Docs preview container */
  .sbdocs .sbdocs-preview .docs-story:has(.ui-demo-frame),
  .sbdocs .sbdocs-preview .ui-theme:has(.ui-demo-frame) {
    padding: 0 !important;
  }
  .sbdocs .sbdocs-preview .ui-demo-frame {
    max-width: 100% !important;
    border: 0 !important;
    border-radius: 0 !important;
    box-shadow: none !important;
  }
  /* When DemoFrame provides its own Show Code / Copy Code bar, hide Storybook's duplicate sibling footer */
  .sbdocs .sbdocs-preview:has(.ui-demo-frame--has-code) + .sbdocs-preview-actions {
    display: none !important;
  }
  /* For stories without custom DemoFrame code (e.g. Button Playground), attach Storybook's native code bar flush to the card */
  .sbdocs .sbdocs-preview:not(:has(.ui-demo-frame--has-code)):has(+ .sbdocs-preview-actions) {
    margin-bottom: 0 !important;
    border-bottom: 0 !important;
    border-bottom-left-radius: 0 !important;
    border-bottom-right-radius: 0 !important;
  }
  .sbdocs .sbdocs-preview:not(:has(.ui-demo-frame--has-code)) + .sbdocs-preview-actions {
    box-sizing: border-box !important;
    width: 100% !important;
    margin: 0 0 28px !important;
    padding: 8px 14px !important;
    border: 1px solid var(--docs-border) !important;
    border-radius: 0 0 14px 14px !important;
    background: var(--docs-surface-subtle) !important;
    box-shadow: 0 1px 3px rgb(0 0 0 / 6%);
  }
  .sbdocs .sbdocs-preview:not(:has(.ui-demo-frame--has-code)) + .sbdocs-preview-actions > div:first-child {
    display: flex !important;
    align-items: center !important;
    justify-content: flex-end !important;
    gap: 6px !important;
    padding: 0 !important;
    margin: 0 !important;
  }
  .sbdocs .sbdocs-preview:not(:has(.ui-demo-frame--has-code)) + .sbdocs-preview-actions > div:first-child button {
    display: inline-flex !important;
    align-items: center !important;
    gap: 6px !important;
    height: 28px !important;
    padding: 0 11px !important;
    margin: 0 !important;
    border-radius: 8px !important;
    border: 1px solid var(--docs-border) !important;
    background: var(--docs-surface) !important;
    color: var(--docs-text-muted) !important;
    font-size: 12px !important;
    font-weight: 500 !important;
    line-height: 1 !important;
    transition: border-color 130ms ease, background-color 130ms ease, color 130ms ease !important;
  }
  .sbdocs .sbdocs-preview:not(:has(.ui-demo-frame--has-code)) + .sbdocs-preview-actions > div:first-child button:hover {
    border-color: var(--docs-accent) !important;
    background: var(--docs-accent-subtle) !important;
    color: var(--docs-accent-text) !important;
  }
  .sbdocs .sbdocs-preview .docblock-source,
  .sbdocs .sbdocs-preview-actions .docblock-source {
    border: 0 !important;
    border-top: 1px solid #1d2538 !important;
    border-radius: 0 !important;
    background: #0b0f19 !important;
    box-shadow: none !important;
    margin: 0 !important;
  }
  .sbdocs .sbdocs-preview .docblock-source pre,
  .sbdocs .sbdocs-preview-actions .docblock-source pre {
    background: #0b0f19 !important;
    color: #e2e8f0 !important;
  }
  .sbdocs table {
    width: 100%;
    margin: 16px 0 24px;
    border-collapse: separate;
    border-spacing: 0;
    border: 1px solid var(--docs-border);
    border-radius: 10px;
    overflow: hidden;
    font-size: 13.5px;
    background: var(--docs-surface);
  }
  .sbdocs table th {
    background: var(--docs-surface-subtle);
    font-size: 11.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--docs-text-muted);
    text-align: left;
  }
  .sbdocs table td,
  .sbdocs table th {
    border-bottom: 1px solid var(--docs-border-soft);
    padding: 11px 14px;
    vertical-align: top;
    line-height: 1.55;
    color: var(--docs-text);
  }
  .sbdocs table tbody tr:last-child td {
    border-bottom: 0;
  }
  .sbdocs table tbody tr:hover td {
    background: var(--docs-row-hover);
  }
  .sbdocs .docblock-source {
    border-radius: 10px;
    border: 1px solid var(--docs-border);
    box-shadow: 0 1px 2px rgb(0 0 0 / 8%);
  }
  .sbdocs .toc-wrapper {
    font-size: 12.5px;
  }
  .sbdocs .toc-list-item a {
    transition: color 120ms ease;
  }
</style>
