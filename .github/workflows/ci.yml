name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Lint (ESLint with React hooks and a11y rules, Stylelint)
        run: pnpm lint
      - name: Build (tokens build fails on any contrast failure)
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit, interaction and axe tests
        run: pnpm test
      - name: Bundle size budgets
        run: pnpm --filter @yourorg/ui size
      - name: Build Storybook
        run: pnpm build-storybook
      - name: Install Playwright Chromium
        run: pnpm --filter @yourorg/storybook exec playwright install --with-deps chromium
      - name: Visual regression tests (Playwright)
        run: pnpm test:visual -- --update-snapshots=missing
      - name: Upload Playwright visual diff report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: |
            apps/storybook/playwright-report
            apps/storybook/test-results
          retention-days: 14
      - name: Visual review (Chromatic, when CHROMATIC_PROJECT_TOKEN is set)
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        uses: chromaui/action@v18
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: apps/storybook/storybook-static

  # Publishes to npm. Off until you're ready: rename the @yourorg packages, add an NPM_TOKEN
  # secret, then set the repo variable ENABLE_RELEASE to "true" (Settings → Secrets and
  # variables → Actions → Variables).
  release:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_RELEASE == 'true'
    needs: check
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm, registry-url: 'https://registry.npmjs.org' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Open release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
