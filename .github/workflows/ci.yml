name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build (tokens build fails on any contrast failure)
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit, interaction and axe tests
        run: pnpm test
      - name: Bundle size budgets
        run: pnpm --filter @yourorg/ui size
      - name: Build Storybook
        run: pnpm build-storybook
      # Visual regression: add Chromatic here once a project token exists
      # - uses: chromaui/action@v11
      #   with: { projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}, storybookBuildDir: apps/storybook/storybook-static }

  release:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, registry-url: 'https://registry.npmjs.org' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Open release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
