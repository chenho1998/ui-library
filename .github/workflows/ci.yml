name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Lint (ESLint with React hooks and a11y rules, Stylelint)
        run: pnpm lint
      - name: Build (tokens build fails on any contrast failure)
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit, interaction and axe tests
        run: pnpm test
      - name: Bundle size budgets
        run: pnpm --filter @yourorg/ui size
      - name: Build Storybook
        run: pnpm build-storybook
      # Visual regression: add Chromatic here once a project token exists
      # - uses: chromaui/action@v11
      #   with: { projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}, storybookBuildDir: apps/storybook/storybook-static }

  # Publishes to npm. Off until you're ready: rename the @yourorg packages, add an NPM_TOKEN
  # secret, then set the repo variable ENABLE_RELEASE to "true" (Settings → Secrets and
  # variables → Actions → Variables).
  release:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_RELEASE == 'true'
    needs: check
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm, registry-url: 'https://registry.npmjs.org' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Open release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
